<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="620" rx="10" fill="#10141D"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#55607A" stroke-width="1.4"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#E39A5C" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="60" y="52" fill="#8A93A6" font-size="15" letter-spacing="4">MOLECULAR AI · ONE SHELF</text>
  <text x="60" y="74" fill="#5B6376" font-size="12" letter-spacing="1">the day→night loop · research note v0.1</text>
  <line x1="60" y1="88" x2="900" y2="88" stroke="#2A3040" stroke-width="1"/>
  <text x="60" y="118" fill="#5B6376" font-size="11" letter-spacing="3">DAY · OPERATIVE MODE</text>
  <text x="900" y="118" fill="#5B6376" font-size="11" letter-spacing="3" text-anchor="end">NIGHT · SLEEP CYCLE</text>

  <!-- Kernel -->
  <g>
    <rect x="60" y="300" width="220" height="130" rx="8" fill="#161B27" stroke="#3C455B" stroke-width="1.4"/>
    <text x="80" y="328" fill="#E6EAF2" font-size="15" font-weight="bold">Kernel — the frozen brain</text>
    <text x="80" y="346" fill="#8A93A6" font-size="11">transformer as a function;</text>
    <text x="80" y="361" fill="#8A93A6" font-size="11">final token choice stays here</text>
    <!-- layer ticks (mid layers highlighted) -->
    <g stroke="#3C455B" stroke-width="1.2">
      <line x1="82" y1="384" x2="112" y2="384"/>
      <line x1="82" y1="394" x2="112" y2="394"/>
      <line x1="82" y1="424" x2="112" y2="424"/>
    </g>
    <g stroke="#E39A5C" stroke-width="1.4">
      <line x1="82" y1="404" x2="112" y2="404"/>
      <line x1="82" y1="414" x2="112" y2="414"/>
    </g>
    <text x="122" y="408" fill="#8A93A6" font-size="10.5">mid-layer activations</text>
    <text x="122" y="422" fill="#5B6376" font-size="10.5">read by probes, not asked</text>
  </g>

  <!-- Observer -->
  <g>
    <rect x="70" y="152" width="200" height="66" rx="8" fill="#161B27" stroke="#3C455B" stroke-width="1.4"/>
    <text x="90" y="177" fill="#E6EAF2" font-size="14" font-weight="bold">Observer</text>
    <text x="90" y="194" fill="#8A93A6" font-size="11">probe classifiers · snapshots</text>
    <text x="90" y="208" fill="#8A93A6" font-size="11">(gap · uncertainty · relevance)</text>
  </g>
  <path d="M 150 300 C 148 268, 150 244, 158 218" fill="none" stroke="#55607A" stroke-width="1.2" stroke-dasharray="3 4" marker-end="url(#arr)"/>

  <!-- Archivist -->
  <g>
    <rect x="360" y="140" width="250" height="120" rx="8" fill="#161B27" stroke="#3C455B" stroke-width="1.4"/>
    <text x="380" y="167" fill="#E6EAF2" font-size="15" font-weight="bold">Archivist</text>
    <text x="380" y="185" fill="#8A93A6" font-size="11">chief + reference clerk · placer · orienteer</text>
    <text x="380" y="203" fill="#8A93A6" font-size="11">motivation gate: no gap &amp; no uncertainty</text>
    <text x="380" y="217" fill="#8A93A6" font-size="11">→ non-intervention</text>
    <text x="380" y="239" fill="#5B6376" font-size="10.5">modes: none · enrich · correct · conflict</text>
  </g>
  <path d="M 270 185 L 358 190" fill="none" stroke="#55607A" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 372 260 C 320 300, 300 320, 284 340" fill="none" stroke="#55607A" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="288" y="296" fill="#8A93A6" font-size="10.5">context insertion,</text>
  <text x="288" y="310" fill="#8A93A6" font-size="10.5">source-marked</text>

  <!-- Archive -->
  <g>
    <rect x="360" y="300" width="250" height="180" rx="8" fill="#161B27" stroke="#3C455B" stroke-width="1.4"/>
    <text x="380" y="327" fill="#E6EAF2" font-size="15" font-weight="bold">Knowledge archive</text>
    <text x="380" y="344" fill="#8A93A6" font-size="11">a delta from the weights · four layers:</text>
    <text x="380" y="358" fill="#8A93A6" font-size="11">content · two embeddings · typed graph ·</text>
    <text x="380" y="372" fill="#8A93A6" font-size="11">metadata with an immutable event log</text>
    <!-- molecule graph -->
    <g stroke="#55607A" stroke-width="1.1" fill="none">
      <path d="M 412 430 L 468 408"/>
      <path d="M 468 408 L 528 428"/>
      <path d="M 468 408 L 500 452"/>
      <path d="M 412 430 L 448 456"/>
      <path d="M 528 428 L 566 404" stroke-dasharray="3 3"/>
    </g>
    <g fill="#10141D" stroke="#8A93A6" stroke-width="1.3">
      <circle cx="412" cy="430" r="6"/>
      <circle cx="468" cy="408" r="6"/>
      <circle cx="528" cy="428" r="6"/>
      <circle cx="500" cy="452" r="6"/>
      <circle cx="448" cy="456" r="6"/>
    </g>
    <circle cx="566" cy="404" r="6" fill="#10141D" stroke="#E39A5C" stroke-width="1.5"/>
    <text x="560" y="446" fill="#5B6376" font-size="10">contradicts · unresolved</text>
    <text x="380" y="470" fill="#5B6376" font-size="10.5">links: develops · contradicts · related_by_generality</text>
  </g>
  <path d="M 485 300 L 485 262" fill="none" stroke="#55607A" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="493" y="284" fill="#5B6376" font-size="10.5">retrieve</text>

  <!-- Sleep cycle -->
  <g>
    <rect x="690" y="140" width="210" height="226" rx="8" fill="#161B27" stroke="#3C455B" stroke-width="1.4"/>
    <text x="710" y="167" fill="#E6EAF2" font-size="15" font-weight="bold">Sleep cycle</text>
    <text x="710" y="184" fill="#8A93A6" font-size="11">owned by consolidation</text>
    <g>
      <rect x="710" y="196" width="170" height="26" rx="5" fill="none" stroke="#3C455B" stroke-width="1.2"/>
      <text x="722" y="213" fill="#8A93A6" font-size="11">1 · day's summary</text>
      <rect x="710" y="228" width="170" height="26" rx="5" fill="none" stroke="#3C455B" stroke-width="1.2"/>
      <text x="722" y="245" fill="#8A93A6" font-size="11">2 · intake &amp; revision</text>
      <rect x="710" y="260" width="170" height="26" rx="5" fill="none" stroke="#3C455B" stroke-width="1.2"/>
      <text x="722" y="277" fill="#8A93A6" font-size="11">3 · summaries &amp; calibration</text>
      <rect x="710" y="292" width="170" height="26" rx="5" fill="none" stroke="#3C455B" stroke-width="1.2"/>
      <text x="722" y="309" fill="#8A93A6" font-size="11">4 · LoRA selection</text>
      <rect x="710" y="324" width="170" height="26" rx="5" fill="none" stroke="#E39A5C" stroke-width="1.4"/>
      <text x="722" y="341" fill="#E6EAF2" font-size="11">5 · train &amp; validate</text>
    </g>
  </g>
  <text x="700" y="392" fill="#5B6376" font-size="10.5">phase 2: input critic (veto) → placer</text>
  <text x="700" y="406" fill="#5B6376" font-size="10.5">builds typed links → orienteer maps</text>
  <path d="M 612 340 C 650 340, 664 300, 688 268" fill="none" stroke="#55607A" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="622" y="312" fill="#5B6376" font-size="10.5">mature,</text>
  <text x="622" y="326" fill="#5B6376" font-size="10.5">conflict-free</text>

  <!-- Consolidation amber path: sleep -> LoRA -> kernel -->
  <path d="M 795 366 C 795 452, 560 522, 296 522 C 220 522, 176 492, 168 434" fill="none" stroke="#E39A5C" stroke-width="1.6" marker-end="url(#arrA)"/>
  <rect x="480" y="506" width="120" height="30" rx="6" fill="#10141D" stroke="#E39A5C" stroke-width="1.5"/>
  <text x="540" y="526" fill="#E39A5C" font-size="12" font-weight="bold" text-anchor="middle">LoRA · versioned</text>
  <text x="620" y="516" fill="#8A93A6" font-size="10.5">consolidation into the weights;</text>
  <text x="620" y="530" fill="#8A93A6" font-size="10.5">rollback = switch adapter version</text>

  <!-- Chronometer bar -->
  <g>
    <rect x="60" y="560" width="840" height="36" rx="7" fill="#161B27" stroke="#3C455B" stroke-width="1.3"/>
    <text x="80" y="583" fill="#E6EAF2" font-size="12.5" font-weight="bold">Chronometer</text>
    <text x="182" y="583" fill="#8A93A6" font-size="11">single aggregator of raw events — subsystems keep no local logs; back come autobiography summaries, one sleep later</text>
  </g>
  <g stroke="#3C455B" stroke-width="1" stroke-dasharray="2 4">
    <line x1="170" y1="430" x2="170" y2="558"/>
    <line x1="485" y1="480" x2="485" y2="506"/>
    <line x1="795" y1="536" x2="795" y2="558"/>
  </g>
</svg>
